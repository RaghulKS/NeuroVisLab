apiVersion: apps/v1
kind: Deployment
metadata:
  name: neurovisionlab-api
  labels:
    app.kubernetes.io/name: neurovisionlab
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: neurovisionlab
  template:
    metadata:
      labels:
        app.kubernetes.io/name: neurovisionlab
    spec:
      containers:
        - name: api
          image: ghcr.io/example/neurovisionlab:replace-at-deploy
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          envFrom:
            - configMapRef:
                name: neurovisionlab-config
          # Production deployments must mount a durable, read/write registry/artifact volume.
          volumeMounts:
            - name: artifacts
              mountPath: /workspace/artifacts
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: "500m", memory: "1Gi" }
            limits: { cpu: "2", memory: "3Gi" }
      volumes:
        - name: artifacts
          persistentVolumeClaim:
            claimName: neurovisionlab-artifacts
